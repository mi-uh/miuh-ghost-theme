minimumReleaseAge: 4320
strictDepBuilds: true
blockExoticSubdeps: true

allowBuilds:
  # Optional dtrace bindings for bunyan (a gscan dependency); not needed to build/test the theme.
  dtrace-provider: false

pnpmfile: []

overrides:
  # archiver still requests minimatch 10 through readdir-glob 3.
  "minimatch@>=7 <11.0.1": 11.0.5
  # Keep the legacy release-utils error dependency on a patched CommonJS uuid.
  "@tryghost/errors@1>uuid": 14.0.3

# The minimumReleaseAge supply-chain policy rejects recently published packages.
# @tryghost/theme-translations is a first-party Ghost dependency we pin exactly,
# so exclude it from the age gate (it would otherwise fail CI after each bump).
minimumReleaseAgeExclude:
  - '@tryghost/theme-translations'
